<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>闪电贪吃蛇</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <div id="header">
            <div class="score-box">
                <span class="label">得分</span>
                <span id="score">0</span>
            </div>
            <div class="score-box">
                <span class="label">最高分</span>
                <span id="best-score">0</span>
            </div>
        </div>

        <canvas id="game-canvas" width="400" height="400"></canvas>

        <div id="controls">
            <div class="ctrl-row">
                <button class="ctrl-btn" id="btn-up">▲</button>
            </div>
            <div class="ctrl-row">
                <button class="ctrl-btn" id="btn-left">◀</button>
                <button class="ctrl-btn" id="btn-right">▶</button>
            </div>
            <div class="ctrl-row">
                <button class="ctrl-btn" id="btn-down">▼</button>
            </div>
        </div>

        <div id="overlay">
            <div id="overlay-content">
                <h2 id="overlay-title">闪电贪吃蛇</h2>
                <p id="overlay-msg">点击开始游戏</p>
                <button id="start-btn">开始</button>
            </div>
        </div>
    </div>

    <script src="game.js"></script>
</body>
</html>
